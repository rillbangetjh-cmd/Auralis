name: Build Auralis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q auralis.zip -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read Gradle version
        run: |
          cat extracted/gradle/wrapper/gradle-wrapper.properties

      - name: Install Gradle
        run: |
          URL=$(grep '^distributionUrl=' extracted/gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2- | sed 's/\\//g')

          echo "Downloading:"
          echo "$URL"

          mkdir -p "$HOME/gradle"

          curl -L "$URL" -o "$HOME/gradle/gradle.zip"

          unzip -q "$HOME/gradle/gradle.zip" -d "$HOME/gradle"

          GRADLE_HOME=$(find "$HOME/gradle" -maxdepth 1 -type d -name "gradle-*" | head -1)

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Patch KSP
        run: |
          echo "Before:"
          grep googleDevtoolsKsp extracted/gradle/libs.versions.toml || true

          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.3.6"/' \
            extracted/gradle/libs.versions.toml

          echo "After:"
          grep googleDevtoolsKsp extracted/gradle/libs.versions.toml || true

      - name: Build APK
        working-directory: extracted
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Locate APK
        if: success()
        run: |
          echo "=== APK ==="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-APK
          path: |
            extracted/**/build/outputs/apk/**/*.apk
